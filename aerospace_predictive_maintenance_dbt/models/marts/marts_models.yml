version: 2

models:

  # ==========================================================
  # ENGINE HEALTH HISTORY
  # ==========================================================

  - name: mart_engine_health_history

    columns:

      - name: data_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TRAIN
                  - TEST

      - name: engine_id
        tests:
          - not_null

      - name: cycle
        tests:
          - not_null

      - name: engine_health_score
        tests:
          - not_null

      - name: degradation_score
        tests:
          - not_null

      - name: risk_level
        tests:
          - not_null


  # ==========================================================
  # CURRENT ENGINE HEALTH
  # ==========================================================

  - name: mart_engine_current_health

    columns:

      - name: data_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TRAIN
                  - TEST

      - name: engine_id
        tests:
          - not_null

      - name: latest_cycle
        tests:
          - not_null

      - name: maximum_cycle
        tests:
          - not_null

      - name: engine_health_score
        tests:
          - not_null

      - name: degradation_score
        tests:
          - not_null

      - name: risk_level
        tests:
          - not_null


  # ==========================================================
  # FLEET HEALTH
  # ==========================================================

  - name: mart_fleet_health

