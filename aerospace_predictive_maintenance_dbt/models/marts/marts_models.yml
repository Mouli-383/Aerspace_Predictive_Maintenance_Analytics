  - name: mart_maintenance_priority

    columns:

      - name: data_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TRAIN
                  - TEST

      - name: engine_id
        tests:
          - not_null

      - name: latest_cycle
        tests:
          - not_null

      - name: engine_health_score
        tests:
          - not_null

      - name: degradation_score
        tests:
          - not_null

