              arguments:
                values:
                  - TRAIN
                  - TEST

      - name: total_engines
        tests:
          - not_null

      - name: average_fleet_health_score
        tests:
          - not_null

      - name: critical_engine_count
        tests:
          - not_null

      - name: fleet_health_percentage
        tests:
          - not_null


